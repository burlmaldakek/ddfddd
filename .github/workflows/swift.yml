name: Build Erosion IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcode-select -p

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Make build scripts executable
        run: |
          chmod +x ./build-airlift-ffi.sh
          chmod +x ./ipabuild.sh

      - name: Verify source layout
        run: |
          test -f AirCard-iOS-main/rust-core/src/exploit.rs
          test -f Erosion.xcodeproj/project.pbxproj
          test -f Erosion/Experimental/Airlift/AirliftBridge.swift
          test -f External/AirliftFFI.xcframework/ios-arm64/libairlift_ffi.a

      - name: Rebuild AirliftFFI
        run: |
          ./build-airlift-ffi.sh
          echo "=== AirliftFFI verification ==="
          ARCHIVE="External/AirliftFFI.xcframework/ios-arm64/libairlift_ffi.a"
          test -s "$ARCHIVE"
          ls -lh "$ARCHIVE"
          # Do not use `strings` to validate a Rust static archive built with
          # thin LTO: archive members can retain LLVM bitcode until the final
          # app link, so source log literals are not guaranteed to appear as
          # plain strings here. The exact source-level checks below validate
          # the implementation, and the final IPA step checks the linked app.
          echo "[OK] AirliftFFI was rebuilt and the iOS static archive is non-empty."

      - name: Validate merged read routing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path("AirCard-iOS-main/rust-core/src/exploit.rs").read_text()
          # Validate by stable function/routing markers instead of slicing between
          # comment delimiters, which are easy to invalidate during source edits.
          assert "pub unsafe fn read_file(" in src
          assert "pub(crate) async fn read_folder(" in src
          assert "exploit_read_media_file(" in src
          assert "exploit_read_media_folder_per_file(" in src
          assert "exploit_read_folder_safe(" in src
          assert "exploit_read_folder_legacy(" in src
          assert "application_data_container_root(&target_dir)" in src
          assert "exploit_read_application_container_subdirs(" in src
          assert 'trimmed == "/var/mobile/Containers"' in src
          assert 'trimmed.starts_with("/var/mobile/Containers/")' in src
          assert 'exploit_read_folder_legacy(pairing_path, target_dir, logger).await' in src
          assert 'exploit_read_folder_safe(pairing_path, target_dir, logger).await' in src
          assert 'alternate_parent_alias: Option<&str>' in src
          assert 'fresh-AFC restore verification succeeded' in src
          assert 'verified through an AFC destination alias' in src
          assert 'original directory is already visible via the original parent alias' in src
          print("[OK] Media, Containers, and legacy non-Media routing markers are present.")
          print("[OK] Exact restore checks both aliases and re-verifies unresolved handoffs on a fresh AFC session.")
          PY

      - name: Clean Xcode build state
        run: |
          rm -rf build
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData/Erosion-*"
          xcodebuild -project Erosion.xcodeproj -scheme Erosion -configuration Release -showBuildSettings >/dev/null

      - name: Build IPA
        run: ./ipabuild.sh

      - name: Verify IPA contains new Airlift code
        run: |
          IPA="$(find . -type f -name '*.ipa' -print -quit)"
          test -n "$IPA"
          rm -rf /tmp/erosion-ipa-verify
          mkdir -p /tmp/erosion-ipa-verify
          unzip -q "$IPA" -d /tmp/erosion-ipa-verify
          APP="/tmp/erosion-ipa-verify/Payload/Erosion.app/Erosion"
          test -f "$APP"
          if strings "$APP" | grep -Fq 'airlift-folder: exact restore attempt' && \
             strings "$APP" | grep -Fq 'SAFE DIRECT AFC SUCCESS' && \
             strings "$APP" | grep -Fq 'exact restore confirmed'; then
            echo "[OK] Final IPA contains v4 non-Media reads and v6 Media reads."
          else
            echo "[ERROR] Final IPA is missing part of the merged read implementation."
            exit 1
          fi
          if strings "$APP" | grep -Fq 'SAFETY STOP — restore verification failed'; then
            echo "[ERROR] Final IPA still contains the old restore-verification failure path."
            exit 1
          fi

      - name: Find IPA
        run: |
          echo "=== IPA FILES ==="
          find . -type f -name "*.ipa" -print

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Erosion-IPA
          path: "**/*.ipa"
          if-no-files-found: error
          retention-days: 7
